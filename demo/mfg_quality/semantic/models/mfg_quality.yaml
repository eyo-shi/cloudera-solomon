version: 0.2.0.dev0
name: mfg_quality
description: Tier1 部品メーカー（東邦精機）の品質保証。ロット系譜・検査・出荷・市場クレーム・作業日報/保全/8D 文書。
ai_context:
  instructions: 結論・根拠・未確定事項を分ける。封じ込めは広げる根拠と絞る根拠の両方を示す。
  examples:
  - SX-5 の異音クレーム 14 件の対象ユニットのロットと製造日は？
  - そのウォームホイールに使われた樹脂ロットは、他にどの製品・どの車種に入っている？
  - 過去に似たような不具合はあった？
  - 検査は全部合格なのに、なぜ不良が出た？
  - 不良条件で作られた可能性がある部品を全部洗い出して
  - 封じ込め対象ロット・出荷先・台数を根拠付きで確定して
  - 北陸ケミカルから東洋ポリマーに切り替えたら、影響する部品と認可状況は？
  - 上記をまとめて 8D の D2〜D4 ドラフトを書いて
  - ロット系譜をグラフで見せて
custom_extensions:
- vendor_name: SOLOMON
  data:
    version: 1
    glossary:
    - term: ロット
      description: 材料・成形・サブ組立・ユニットの追跡単位
    - term: ロット系譜
      description: lot_genealogy の親子消費関係
    - term: 8D
      description: 8 ディシプリン問題解決レポート
    - term: PPAP
      description: Production Part Approval Process
    - term: 4M 変更
      description: Man/Machine/Material/Method 変更届
    - term: FMEA
      description: 故障モード影響解析
    - term: バックラッシ
      description: 歯車の歯隙
    - term: 封じ込め
      description: 影響範囲の特定と流出防止
    - term: 横展開
      description: 類似品目・ラインへの展開
    tool_hints:
      table: 数量・一覧・集計・検査値
      graph: ロット系譜の多段トレース、部品から車種・OEM まで
      search: 作業日報・保全・8D・クレーム文書の自由記述
    graph_examples:
    - question: 材料ロットから搭載車種まで
      cypher: MATCH (r:Lot {lot_id:$lot_id})-[:CONSUMED_BY*1..6]->(u:Lot {lot_type:'UNIT'})-[:SHIPPED_AS]->(:Shipment)-[:FOR_MODEL]->(m:VehicleModel)
        RETURN m.model_name, count(DISTINCT u) AS units
      notes: 可変長 CONSUMED_BY
    search:
      expansion_instructions: 班長の口語・略称・擬音語、保全員の型番、品証の技術用語、ディーラーの利用者語が混在する。
      use_synonyms: false
    verified_queries:
    - question: SX-5 異音クレームのユニットロットと製造日
      sql: SELECT u.lot_id, u.prod_date FROM iceberg.mfg_quality.field_claims c JOIN
        iceberg.mfg_quality.unit_lots u ON c.unit_lot_id = u.lot_id WHERE c.model_code
        = 'SX-5' AND c.claim_date >= DATE '2026-10-01' GROUP BY u.lot_id, u.prod_date
      notes: Q1 相当
