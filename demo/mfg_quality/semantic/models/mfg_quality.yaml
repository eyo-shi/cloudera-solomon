- name: bom_child
  from: bom
  to: parts
  from_columns:
  - child_part_no
  to_columns:
  - part_no
- name: doc_mentions_lot_doc
  from: doc_mentions_lot
  to: doc_index
  from_columns:
  - doc_id
  to_columns:
  - doc_id
- name: doc_mentions_eq_doc
  from: doc_mentions_equipment
  to: doc_index
  from_columns:
  - doc_id
  to_columns:
  - doc_id
- name: doc_mentions_part_doc
  from: doc_mentions_part
  to: doc_index
  from_columns:
  - doc_id
  to_columns:
  - doc_id
- name: equipment_parent
  from: equipment
  to: equipment
  from_columns:
  - parent_equipment_id
  to_columns:
  - equipment_id
metrics:
- name: backlash_usl_ratio
  expression: AVG(value / usl)
  description: バックラッシ測定値の上限比（item=バックラッシ）
- name: shipped_units
  expression: SUM(qty)
  description: 出荷台数
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      dataset: shipments
