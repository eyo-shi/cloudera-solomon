version: 0.2.0.dev0
name: mfg_quality
description: Tier1 部品メーカー（東邦精機）の品質保証。ロット系譜・検査・出荷・市場クレーム・作業日報/保全/8D 文書。
ai_context:
  instructions: 結論・根拠・未確定事項を分ける。封じ込めは広げる根拠と絞る根拠の両方を示す。
  examples:
  - SX-5 の異音クレーム 14 件の対象ユニットのロットと製造日は？
  - そのウォームホイールに使われた樹脂ロットは、他にどの製品・どの車種に入っている？
  - 過去に似たような不具合はあった？
  - 検査は全部合格なのに、なぜ不良が出た？
  - 不良条件で作られた可能性がある部品を全部洗い出して
  - 封じ込め対象ロット・出荷先・台数を根拠付きで確定して
  - 北陸ケミカルから東洋ポリマーに切り替えたら、影響する部品と認可状況は？
  - 上記をまとめて 8D の D2〜D4 ドラフトを書いて
  - ロット系譜をグラフで見せて
custom_extensions:
- vendor_name: SOLOMON
  data:
    version: 1
    glossary:
    - term: ロット
      description: 材料・成形・サブ組立・ユニットの追跡単位
    - term: ロット系譜
      description: lot_genealogy の消費関係（child_lot_id = 投入側、parent_lot_id = 生成側）
    - term: 北陸ケミカル
      description: 樹脂メーカー（supplier_id SUP-NC）。PA66-GF30 の主サプライヤ
    - term: 東洋ポリマー
      description: 代替樹脂メーカー（supplier_id SUP-TP）
    - term: Tier1 在庫
      description: 東邦精機（tier 1）が保管する在庫。inventory.tier = 1
    - term: Tier2 在庫
      description: 三協モールド（tier 2）が保管する在庫。inventory.tier = 2
    - term: 8D
      description: 8 ディシプリン問題解決レポート
    - term: PPAP
      description: Production Part Approval Process
    - term: 4M 変更
      description: Man/Machine/Material/Method 変更届
    - term: FMEA
      description: 故障モード影響解析
    - term: バックラッシ
      description: 歯車の歯隙
    - term: 封じ込め
      description: 影響範囲の特定と流出防止
    - term: 横展開
      description: 類似品目・ラインへの展開
    tool_hints:
      table: 数量・一覧・集計・検査値
      graph: ロット系譜の多段トレース、部品から車種・OEM まで
      search: 作業日報・保全・8D・クレーム文書の自由記述
    graph_examples:
    - question: 材料ロットから搭載車種まで
      cypher: MATCH (r:Lot {lot_id:$lot_id})-[:CONSUMED_BY*1..6]->(u:Lot {lot_type:'UNIT'})
        WITH DISTINCT u MATCH (u)-[:SHIPPED_AS]->(s:Shipment)-[:FOR_MODEL]->(m:VehicleModel)
        RETURN u.part_no AS product, m.model_name AS model, count(DISTINCT u) AS unit_lots,
        sum(s.qty) AS vehicles
      notes: 可変長 CONSUMED_BY（下流向き）。同じユニットに複数経路で届くので WITH DISTINCT u で重複を除いてから台数を合計する
    - question: ユニットロットに使われた材料ロット（上流）
      cypher: MATCH (m:Lot {lot_type:'MATERIAL'})-[:CONSUMED_BY*1..6]->(u:Lot {lot_id:$unit_lot_id})
        RETURN DISTINCT m.lot_id AS material_lot
      notes: 矢印は常に投入側 → 生成側。上流は終点にユニットを置く
    search:
      expansion_instructions: 班長の口語・略称・擬音語、保全員の型番、品証の技術用語、ディーラーの利用者語が混在する。
      use_synonyms: false
    verified_queries:
    - question: SX-5 異音クレームのユニットロットと製造日
      sql: SELECT u.lot_id, u.prod_date FROM iceberg.mfg_quality.field_claims c JOIN
        iceberg.mfg_quality.unit_lots u ON c.unit_lot_id = u.lot_id WHERE c.model_code
        = 'SX-5' AND c.claim_date >= DATE '2026-10-01' GROUP BY u.lot_id, u.prod_date
      notes: Q1 相当
    - question: ユニットロットに使われた成形ロットと樹脂ロット（上流トレース）
      sql: WITH RECURSIVE up(lot_id, depth) AS (SELECT child_lot_id, 1 FROM iceberg.mfg_quality.lot_genealogy
        WHERE parent_lot_id IN ('U-A200-260601', 'U-A200-260602', 'U-A200-260603') UNION ALL
        SELECT g.child_lot_id, up.depth + 1 FROM iceberg.mfg_quality.lot_genealogy g JOIN up
        ON g.parent_lot_id = up.lot_id WHERE up.depth < 8) SELECT DISTINCT l.lot_id, l.lot_type,
        l.part_no, l.prod_date, l.equipment_id FROM up JOIN iceberg.mfg_quality.lots l ON l.lot_id
        = up.lot_id WHERE l.lot_type IN ('MOLD', 'MATERIAL') ORDER BY l.lot_type, l.lot_id
      notes: 上流は parent_lot_id = X から child_lot_id をたどる
    - question: 樹脂ロットが入った製品・車種・台数（下流トレース）
      sql: WITH RECURSIVE down(lot_id, depth) AS (SELECT parent_lot_id, 1 FROM iceberg.mfg_quality.lot_genealogy
        WHERE child_lot_id = 'HC-2605-117' UNION ALL SELECT g.parent_lot_id, down.depth + 1
        FROM iceberg.mfg_quality.lot_genealogy g JOIN down ON g.child_lot_id = down.lot_id WHERE
        down.depth < 8), units AS (SELECT DISTINCT u.lot_id, u.part_no FROM down JOIN iceberg.mfg_quality.unit_lots
        u ON u.lot_id = down.lot_id) SELECT units.part_no, s.oem_id, s.model_code, count(DISTINCT
        units.lot_id) AS unit_lots, sum(s.qty) AS vehicles FROM units JOIN iceberg.mfg_quality.shipments
        s ON s.unit_lot_id = units.lot_id GROUP BY units.part_no, s.oem_id, s.model_code ORDER
        BY s.model_code
      notes: 下流は child_lot_id = X から parent_lot_id をたどる。段数は品目により 3〜5 段なので固定 JOIN は不可。ユニットを DISTINCT してから台数を合計する
    - question: 材料の代替サプライヤ切替で影響する部品と PPAP 状況
      sql: SELECT a.part_no, p.name, a.ppap_status FROM iceberg.mfg_quality.supplier_alternatives
        a JOIN iceberg.mfg_quality.parts p ON p.part_no = a.part_no WHERE a.material_part_no =
        'PA66-GF30' AND a.supplier_id = 'SUP-NC' AND a.alt_supplier_id = 'SUP-TP' ORDER BY a.ppap_status,
        a.part_no
      notes: SUP-NC = 北陸ケミカル、SUP-TP = 東洋ポリマー
datasets:
- name: suppliers
  source: iceberg.mfg_quality.suppliers
  description: サプライヤマスタ。tier 1=東邦精機（自社）、2=三協モールド（成形）、3=樹脂メーカー（北陸ケミカル / 東洋ポリマー）。
  fields:
  - name: supplier_id
    datatype: String
    description: サプライヤ ID
  - name: name
    datatype: String
    description: 名称
  - name: tier
    datatype: Int32
    description: Tier 1/2/3
  - name: country
    datatype: String
    description: 国
  - name: plant
    datatype: String
    description: 拠点
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: Supplier
          id_field: supplier_id
          property_fields:
          - name
          - tier
- name: supplier_alternatives
  source: iceberg.mfg_quality.supplier_alternatives
  description: 代替サプライヤと PPAP 状況。1 行 = 材料 material_part_no を使う部品 part_no について、主サプライヤ supplier_id から代替 alt_supplier_id へ切り替える場合の PPAP 状態（APPROVED / PENDING）。
  fields:
  - name: material_part_no
    datatype: String
    description: 材料品番
  - name: part_no
    datatype: String
    description: その材料を使う部品の品番
  - name: supplier_id
    datatype: String
    description: 主サプライヤ
  - name: alt_supplier_id
    datatype: String
    description: 代替サプライヤ
  - name: ppap_status
    datatype: String
    description: PPAP 状態
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
- name: parts
  source: iceberg.mfg_quality.parts
  description: 品番マスタ。category = 材料 / 成形品 / サブ組立 / ユニット。成形品の material_spec が使用樹脂（例 PA66-GF30）。
  fields:
  - name: part_no
    datatype: String
    description: 品番
  - name: name
    datatype: String
    description: 品名
  - name: category
    datatype: String
    description: 材料/成形品/サブ組立/ユニット
  - name: material_spec
    datatype: String
    description: 材料規格
  - name: supplier_id
    datatype: String
    description: 主サプライヤ
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: MfgPart
          id_field: part_no
          property_fields:
          - name
          - category
        edges:
        - label: PART_SUPPLIED_BY
          from_label: MfgPart
          to_label: Supplier
          from_field: part_no
          to_field: supplier_id
- name: bom
  source: iceberg.mfg_quality.bom
  description: 部品構成（品番レベル）。1 行 = 親品番 parent_part_no が子品番 child_part_no を員数 qty_per 使う。ロット単位の実績は lot_genealogy を使う。
  fields:
  - name: parent_part_no
    datatype: String
    description: 親品番
  - name: child_part_no
    datatype: String
    description: 子品番
  - name: qty_per
    datatype: Decimal
    description: 員数
  - name: valid_from
    datatype: Date
    description: 有効開始
  - name: valid_to
    datatype: Date
    description: 有効終了
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        edges:
        - label: HAS_CHILD
          from_label: MfgPart
          to_label: MfgPart
          from_field: parent_part_no
          to_field: child_part_no
- name: equipment
  source: iceberg.mfg_quality.equipment
  description: 設備マスタ。成形機 M-01..M-12、乾燥機 D-01..D-12（parent_equipment_id = 付属する成形機）、組立ライン L-xxx、北見工場の成形機 K-xx。
  fields:
  - name: equipment_id
    datatype: String
    description: 設備 ID
  - name: name
    datatype: String
    description: 設備名
  - name: type
    datatype: String
    description: 成形機/乾燥機/組立ライン
  - name: plant
    datatype: String
    description: 工場
  - name: parent_equipment_id
    datatype: String
    description: 親設備
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: Equipment
          id_field: equipment_id
          property_fields:
          - name
          - type
          - plant
- name: material_lots
  source: iceberg.mfg_quality.material_lots
  description: 樹脂材料の入荷ロット（HC-yyMM-nnn）。lots にも lot_type=MATERIAL で同じ lot_id がある。
  fields:
  - name: lot_id
    datatype: String
    description: 材料ロット HC-yyMM-nnn
  - name: part_no
    datatype: String
    description: 材料品番
  - name: supplier_id
    datatype: String
    description: サプライヤ
  - name: receipt_date
    datatype: Date
    description: 入荷日
    dimension:
      is_time: true
  - name: qty_kg
    datatype: Decimal
    description: 数量 kg
  - name: coa_moisture_pct
    datatype: Decimal
    description: CoA 水分率
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        edges:
        - label: LOT_SUPPLIED_BY
          from_label: Lot
          to_label: Supplier
          from_field: lot_id
          to_field: supplier_id
- name: production_runs
  source: iceberg.mfg_quality.production_runs
  description: 作業実績。1 行 = 1 ロットの生産（output_lot_id）。どの設備（equipment_id）でいつ作ったかを持つ。
  fields:
  - name: run_id
    datatype: String
    description: 作業 ID
  - name: equipment_id
    datatype: String
    description: 設備
  - name: output_lot_id
    datatype: String
    description: 出力ロット
  - name: part_no
    datatype: String
    description: 品番
  - name: start_ts
    datatype: Timestamp
    description: 開始
    dimension:
      is_time: true
  - name: end_ts
    datatype: Timestamp
    description: 終了
    dimension:
      is_time: true
  - name: qty
    datatype: Int32
    description: 数量
  - name: operator_id
    datatype: String
    description: 作業者
  - name: shift
    datatype: String
    description: シフト
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        edges:
        - label: PRODUCED_ON
          from_label: Lot
          to_label: Equipment
          from_field: output_lot_id
          to_field: equipment_id
          id_field: run_id
- name: lot_genealogy
  source: iceberg.mfg_quality.lot_genealogy
  description: ロット系譜。1 行 = 1 段の消費関係で、child_lot_id（投入されたロット）を使って parent_lot_id（生成されたロット）を作った。材料 → 成形 → サブ組立 → ユニットは child → parent の向きに進み、品目により 3〜5 段。下流（どこに使われたか）は child_lot_id = X から parent_lot_id をたどり、上流（何を使ったか）は parent_lot_id = X から child_lot_id をたどる。段数が可変なので WITH RECURSIVE か graph を使う。
  fields:
  - name: edge_id
    datatype: String
    description: 辺 ID
  - name: child_lot_id
    datatype: String
    description: 投入（消費）された上流側ロット
  - name: parent_lot_id
    datatype: String
    description: それを使って生成された下流側ロット
  - name: qty_used
    datatype: Decimal
    description: 使用量
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        edges:
        - label: CONSUMED_BY
          from_label: Lot
          to_label: Lot
          from_field: child_lot_id
          to_field: parent_lot_id
          id_field: edge_id
- name: inspection_results
  source: iceberg.mfg_quality.inspection_results
  description: 検査結果。成形ロットの バックラッシ / 外径 / 歯形 を記録。judgment は規格内なら OK。value / usl で上限比を見る。
  fields:
  - name: insp_id
    datatype: String
    description: 検査 ID
  - name: lot_id
    datatype: String
    description: ロット
  - name: item
    datatype: String
    description: 検査項目
  - name: value
    datatype: Decimal
    description: 測定値
  - name: lsl
    datatype: Decimal
    description: 下限
  - name: usl
    datatype: Decimal
    description: 上限
  - name: judgment
    datatype: String
    description: 判定
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
- name: unit_lots
  source: iceberg.mfg_quality.unit_lots
  description: 完成ユニットのロット（U-品番略-yymmdd）。lots にも lot_type=UNIT で同じ lot_id がある。出荷は shipments.unit_lot_id で結合。
  fields:
  - name: lot_id
    datatype: String
    description: ユニットロット U-品番略-yymmdd
  - name: part_no
    datatype: String
    description: 品番
  - name: plant
    datatype: String
    description: 工場
  - name: prod_date
    datatype: Date
    description: 製造日
    dimension:
      is_time: true
  - name: qty
    datatype: Int32
    description: 数量
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
- name: shipments
  source: iceberg.mfg_quality.shipments
  description: 出荷実績。1 行 = ユニットロットのある出荷（OEM・車種・台数・VIN 範囲）。台数は qty の合計。
  fields:
  - name: shipment_id
    datatype: String
    description: 出荷 ID
  - name: unit_lot_id
    datatype: String
    description: ユニットロット
  - name: oem_id
    datatype: String
    description: OEM
  - name: model_code
    datatype: String
    description: 車種コード
  - name: ship_date
    datatype: Date
    description: 出荷日
    dimension:
      is_time: true
  - name: qty
    datatype: Int32
    description: 台数
  - name: vin_from
    datatype: String
    description: VIN 始
  - name: vin_to
    datatype: String
    description: VIN 終
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: Shipment
          id_field: shipment_id
          property_fields:
          - ship_date
          - qty
        edges:
        - label: SHIPPED_AS
          from_label: Lot
          to_label: Shipment
          from_field: unit_lot_id
          to_field: shipment_id
        - label: FOR_MODEL
          from_label: Shipment
          to_label: VehicleModel
          from_field: shipment_id
          to_field: model_code
- name: vehicle_models
  source: iceberg.mfg_quality.vehicle_models
  description: 車種マスタ（OEM ごと）。
  fields:
  - name: model_code
    datatype: String
    description: 車種コード
  - name: model_name
    datatype: String
    description: 車種名
  - name: oem_id
    datatype: String
    description: OEM
  - name: sop_date
    datatype: Date
    description: SOP
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: VehicleModel
          id_field: model_code
          property_fields:
          - model_name
        edges:
        - label: OF_OEM
          from_label: VehicleModel
          to_label: OEM
          from_field: model_code
          to_field: oem_id
- name: oem_customers
  source: iceberg.mfg_quality.oem_customers
  description: OEM（自動車メーカー）マスタ。
  fields:
  - name: oem_id
    datatype: String
    description: OEM ID
  - name: name
    datatype: String
    description: OEM 名
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: OEM
          id_field: oem_id
          property_fields:
          - name
- name: field_claims
  source: iceberg.mfg_quality.field_claims
  description: 市場クレーム。1 行 = 1 台（VIN）。unit_lot_id で搭載ユニットロットに結合。symptom_code は NOISE / RATTLE 等、symptom_text は自由記述。
  fields:
  - name: claim_id
    datatype: String
    description: クレーム ID
  - name: oem_id
    datatype: String
    description: OEM
  - name: model_code
    datatype: String
    description: 車種
  - name: vin
    datatype: String
    description: VIN
  - name: unit_lot_id
    datatype: String
    description: ユニットロット
  - name: claim_date
    datatype: Date
    description: 受付日
    dimension:
      is_time: true
  - name: symptom_code
    datatype: String
    description: 症状コード
  - name: symptom_text
    datatype: String
    description: 症状記述
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
- name: defects
  source: iceberg.mfg_quality.defects
  description: 工程内不良記録。defect_code は 外観その他 / 寸法 / 欠け など。note に経緯や関連文書番号。
  fields:
  - name: defect_id
    datatype: String
    description: 不良 ID
  - name: lot_id
    datatype: String
    description: ロット
  - name: defect_code
    datatype: String
    description: 不良コード
  - name: qty
    datatype: Int32
    description: 数量
  - name: note
    datatype: String
    description: 備考
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
- name: doc_index
  source: iceberg.mfg_quality.doc_index
  description: 文書メタデータ（本文は OpenSearch）。日報・保全・8D・不具合報告・クレーム文・FMEA・4M 変更届。
  fields:
  - name: doc_id
    datatype: String
    description: 文書 ID
  - name: doc_type
    datatype: String
    description: 種別
  - name: doc_date
    datatype: Date
    description: 日付
    dimension:
      is_time: true
  - name: plant
    datatype: String
    description: 工場
    custom_extensions:
    - vendor_name: SOLOMON
      data:
        version: 1
        filterable: true
  - name: equipment_id
    datatype: String
    description: 設備
    custom_extensions:
    - vendor_name: SOLOMON
      data:
        version: 1
        filterable: true
  - name: part_no
    datatype: String
    description: 品番
    custom_extensions:
    - vendor_name: SOLOMON
      data:
        version: 1
        filterable: true
  - name: lot_ids
    datatype: Opaque
    description: 関連ロット配列
    custom_extensions:
    - vendor_name: SOLOMON
      data:
        version: 1
        physical_type: array(varchar)
  - name: title
    datatype: String
    description: タイトル
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: document_index
      queryable: false
      document_index:
        index: solomon-docs
        id_field: doc_id
        title_field: title
        text_field: body
        type_field: doc_type
        date_field: doc_date
        doc_types:
        - id: daily_report
          label: 作業日報
          description: 現場班長の日次記録
        - id: maintenance
          label: 設備保全記録
          description: 保全作業・部品交換
        - id: 8d
          label: 8D レポート
          description: 8 ディシプリン報告
        - id: defect_report
          label: 不具合報告書
          description: 工程内不具合
        - id: oem_claim
          label: OEM クレーム文
          description: 市場クレーム
        - id: fmea
          label: FMEA
          description: 故障モード解析
        - id: change_notice
          label: 4M 変更届
          description: 変更・PPAP
- name: lots
  source: iceberg.mfg_quality.lots
  description: 全階層ロットの統合表（MATERIAL / MOLD / SUBASSY / UNIT）。lot_genealogy の両端はすべてここにある。成形ロット ML-材料ロット-品番-連番、サブ組立 SA-品番略-yymmdd-nn、ユニット U-品番略-yymmdd。equipment_id は生産設備。
  fields:
  - name: lot_id
    datatype: String
    description: ロット ID
  - name: lot_type
    datatype: String
    description: MATERIAL/MOLD/SUBASSY/UNIT
  - name: part_no
    datatype: String
    description: 品番
  - name: plant
    datatype: String
    description: 工場
  - name: prod_date
    datatype: Date
    description: 製造日
    dimension:
      is_time: true
  - name: equipment_id
    datatype: String
    description: 設備
  - name: qty
    datatype: Int32
    description: 数量
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
      graph:
        vertex:
          label: Lot
          id_field: lot_id
          property_fields:
          - lot_type
          - part_no
          - prod_date
          - plant
          description: 全階層ロット統合頂点
- name: doc_mentions_lot
  source: iceberg.mfg_quality.doc_mentions_lot
  description: 文書が言及するロット（graph 専用）。
  fields:
  - name: doc_id
    datatype: String
    description: 文書
  - name: entity_id
    datatype: String
    description: ロット ID
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: graph_only
      queryable: false
- name: doc_mentions_equipment
  source: iceberg.mfg_quality.doc_mentions_equipment
  description: 文書が言及する設備（graph 専用）。
  fields:
  - name: doc_id
    datatype: String
    description: 文書
  - name: entity_id
    datatype: String
    description: 設備 ID
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: graph_only
      queryable: false
- name: doc_mentions_part
  source: iceberg.mfg_quality.doc_mentions_part
  description: 文書が言及する品番（graph 専用）。
  fields:
  - name: doc_id
    datatype: String
    description: 文書
  - name: entity_id
    datatype: String
    description: 品番
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: graph_only
      queryable: false
- name: equipment_links
  source: iceberg.mfg_quality.equipment_links
  description: 設備の付属関係（乾燥機 → 成形機）。
  fields:
  - name: edge_id
    datatype: String
    description: 辺 ID
  - name: equipment_id
    datatype: String
    description: 設備
  - name: parent_equipment_id
    datatype: String
    description: 親設備
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: graph_only
      queryable: false
      graph:
        edges:
        - label: ATTACHED_TO
          from_label: Equipment
          to_label: Equipment
          from_field: equipment_id
          to_field: parent_equipment_id
          id_field: edge_id
- name: inventory
  source: iceberg.mfg_quality.inventory
  description: 在庫（基準日時点）。1 行 = あるロットの保管数量。holder_supplier_id が保管している会社、tier はその Tier（1=東邦精機, 2=三協モールド）、location は倉庫・仕掛区分。出荷済みの数量は含まない。
  fields:
  - name: inventory_id
    datatype: String
    description: 在庫 ID
  - name: lot_id
    datatype: String
    description: ロット（lots.lot_id）
  - name: part_no
    datatype: String
    description: 品番
  - name: holder_supplier_id
    datatype: String
    description: 保管会社（suppliers.supplier_id）
  - name: tier
    datatype: Int32
    description: 保管会社の Tier
  - name: location
    datatype: String
    description: 保管場所
  - name: qty
    datatype: Int32
    description: 在庫数量
  - name: as_of_date
    datatype: Date
    description: 基準日
    dimension:
      is_time: true
  custom_extensions:
  - vendor_name: SOLOMON
    data:
      version: 1
      kind: table
      queryable: true
