# 封じ込め範囲 = D-07 不調期間に M-07 で成形した 15 ロット（117 由来 9 + 121 由来 6）の下流すべて。
# 出荷合計 12,100 台 = 117 由来 11,400 台（Q2）+ 121 由来 700 台（SX-5 向け U-A200-260605）。
# 在庫: Tier1 = SA-A200-260604-01（600）+ U-P55-260611（640）、Tier2 = ML-2605-121-WH200-05/06（1,600 + 1,500）。
# 値は agent 採点の must-contain に使われるので、説明文はコメントに書く。
containment:
  mold_lots: 15
  subassy_lots: 11
  unit_lots: 8
