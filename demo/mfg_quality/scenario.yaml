  pg310: { part_no: PG-310, name: パワーウィンドウ用ギア }
  eps_a200: { part_no: EPS-A200, name: EPS ユニット SX-5 向け }
  eps_a210: { part_no: EPS-A210, name: EPS ユニット派生 }
  pwr55: { part_no: PWR-55, name: レギュレータユニット }

incident:
  year: 2026
  claim:
    oem: OEM-MIRAI
    model: SX-5
    symptom_market: ハンドルを切るとゴトゴト
    count: 14
    unit_lots:
      - { lot_id: U-A200-260601, prod_date: "2026-06-01" }
