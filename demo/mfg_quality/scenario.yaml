# 仕込み文書（本文はここが正。生成器は must_include / must_exclude を検証する）
planted_documents:
  - doc_id: QR-2024-0815
    doc_type: 8d
    doc_date: "2024-08-15"
    plant: 北見工場
    equipment_id: K-03
    part_no: PG-310
    lot_ids: [HC-2408-033, ML-2408-033-PG310-01]
    title: 8D QR-2024-0815 PG-310 噛み合い打音（北見工場）
    body: |-
      8D レポート QR-2024-0815（北見工場 / PG-310 パワーウィンドウ用ギア）
      D1 チーム: 品証・北見成形課・三協モールド技術
      D2 現象: 客先返却品で、ウィンドウ昇降時にギアの噛み合い部から打音（コトコト）。樹脂ギアのガタ・遊び大を確認。寸法・外観検査は全数合格。
      D3 暫定処置: 成形ロット ML-2408-033-PG310-01 の出荷停止と在庫選別。
      D4 真因: ペレット吸湿。ホッパードライヤーの露点計ドリフトで乾燥不足のまま成形し、加水分解で歯面強度が低下。バックラッシは規格内だが上限寄り。
      D5/D6 恒久対策: 露点計の定期校正（月次）、乾燥 4h の遵守、乾燥条件の記録化。
      D7 横展開: （未記入）
      D8 完了: 2024-09-30
    must_include: [打音, コトコト, ペレット吸湿, 露点計, "（未記入）"]
    must_exclude: [異音]
  - doc_id: DR-2025-0320-北見
    doc_type: daily_report
    doc_date: "2025-03-20"
    plant: 北見工場
    equipment_id: K-03
    part_no: PG-310
    lot_ids: []
    title: 作業日報 2025-03-20 北見 成形 3 号機
    body: |-
      作業日報 2025-03-20 北見工場 成形 3 号機（PG-310）。
      立ち上げ品の噛み合い確認でコトコト音あり。ペレット水分が高めのため乾燥やり直し（4h）を実施し、再確認で音なし。
    must_include: [コトコト, 乾燥やり直し]
    must_exclude: [異音]
  - doc_id: DR-2026-0512-M07
    doc_type: daily_report
    doc_date: "2026-05-12"
    plant: 豊浜工場
    equipment_id: M-07
