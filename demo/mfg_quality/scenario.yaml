    equipment_id: D-07
    parent_machine: M-07
    start: "2026-05-12"
    end: "2026-05-26"
    maintenance_note: 露点計不調、部品入荷待ち、5/26 交換完了
  material_lots:
    primary: HC-2605-117
    secondary: HC-2605-121
  mold_lots_from_117: 9   # WH-200×6, PG-310×3
  mold_lots_from_121: 6
  mold_lots_d07_window: 15  # 117→9 + 121→6
  dry_shorten_reports: 5    # 2026-05-14..05-24

genealogy_hops:
  note: |
    lot_genealogy は 1 行 = 1 段の消費関係。child_lot_id = 投入（消費）されたロット、
    parent_lot_id = それを使って作られたロット。材料 → 成形 → … → ユニットは child → parent の向き。
    段数は材料ロットからユニットロットまでの辺の数。
    固定 3 段 JOIN では SX-5 の EPS-A200 経路しか出ず、PG-310→PWR-55（4 段, VN-7）や
    WH-200→EPS-A210（5 段, CV-3 / KX-1）が漏れる。
  eps_a200_path_hops: 3   # 材料→成形→サブ組立→ユニット
  pg310_pwr55_path_hops: 4  # 材料→成形→サブ組立×2→ユニット
  wh200_eps_a210_path_hops: 5  # 材料→成形→サブ組立×3→ユニット

hidden_facts:
