name: Solomon
description: |
  自然言語の対話を通して、マルチエージェントワークフローを活用し、Lakehouse (Trino + Iceberg)、PuppyGraph、OpenSearch、S3にまたがる読み取り専用の Agentic RAG / 分析チャットを提供する。

author: Cloudera
date: "2026-09-19"
specification_version: 1.0
prototype_version: 0.2.0

# ---------------------------------------------------------------------------
# Runtime (Python 3.12)
# ---------------------------------------------------------------------------
runtimes:
  - editor: PBJ Workbench
    kernel: Python 3.12
    edition: Solomon Edition

# ---------------------------------------------------------------------------
# Deploy フォーム (AMP Configuration 画面に表示される Environment Variables)
#
# 方針: Deploy 時は MODE 選択のみ。PuppyGraph Bolt URI は post-deploy の
# .solomon/deploy.env (PUPPYGRAPH_URI)。Trino / S3 は
# Site Administration → Data Connections が single source of truth。
# 接続 URI・launcher チューニング・LLM / CDV は Deploy 後に
# Project → Settings → Advanced → Environment Variables で設定する。
#
# --- Deploy フォームに含めない項目 (post-deploy 参照) ---
#
# [PuppyGraph] post-deploy .solomon/deploy.env:
#   PUPPYGRAPH_URI (bolt://host:7687), catalog/schema は PuppyGraph 側
#
# [external OpenSearch] OPENSEARCH_MODE=external のとき:
#   OPENSEARCH_CONNECTION_NAME または OPENSEARCH_ENDPOINT,
#   OPENSEARCH_NAMESPACE, OPENSEARCH_USERNAME / OPENSEARCH_PASSWORD
#
# [external Trino] TRINO_MODE=external のとき:
#   TRINO_URL または TRINO_HOST 等 (README 参照)
#
# [internal モード optional] launcher 既定値で動作。変更する場合のみ post-deploy:
#   OPENSEARCH_MEMORY (2Gi), OPENSEARCH_USE_PVC (false),
#   OPENSEARCH_ENDPOINT (DNS 不通時)
#   TRINO_MEMORY (2Gi), TRINO_USE_PVC (false), TRINO_ENDPOINT (DNS 不通時)
#   PUPPYGRAPH_IMAGE (mirror), PUPPYGRAPH_MEMORY (8Gi), PUPPYGRAPH_USE_PVC (false),
#   PUPPYGRAPH_URI (DNS 不通時)
#
# [その他 post-deploy] LLM, S3 上書き, CDV — README「Deploy 後の設定手順」参照
# ---------------------------------------------------------------------------
environment_variables:
  SOLOMON_LOG_LEVEL:
    default: "INFO"
    description: ログレベル (DEBUG / INFO / WARNING / ERROR)。通常は変更不要。
    required: false
  PUPPYGRAPH_MODE:
    default: "internal"
    description: >-
      PuppyGraph 接続方式。internal (デフォルト) = puppygraph-launcher が CML 内で起動。
      external = 外部 PuppyGraph — Deploy 後に .solomon/deploy.env で PUPPYGRAPH_URI を設定。
    required: false
  OPENSEARCH_MODE:
    default: "external"
    description: >-
      OpenSearch 接続方式。external (デフォルト) = Semantic Search 等 — Deploy 後に接続 env を設定。
      internal = opensearch-launcher が CML 内で起動。
    required: false
  TRINO_MODE:
    default: "external"
    description: >-
      Trino / Tables 接続方式。external (デフォルト) = CDW Trino — Deploy 後に
      TRINO_URL 等を設定。internal = warehouse-launcher (Trino + DuckDB デモ) —
      Data Connection または TRINO_HOST を設定。
    required: false

# ---------------------------------------------------------------------------
# Feature dependencies (Workbench 側の必須機能)
# ---------------------------------------------------------------------------
feature_dependencies:
  - model_deployment

# ---------------------------------------------------------------------------
# セットアップ手順 (上から順に実行される)
# ---------------------------------------------------------------------------
tasks:
  # 1. Python 依存を editable install する。crewai / boto3 / trino / pyarrow …
  - type: run_session
    name: Install Python dependencies
    script: amp/01_install_python_deps.py
    short_summary: pip install -e . --no-deps で solomon パッケージのみ editable install
    long_summary: >-
      Solomon Edition カスタム Runtime に bake 済みの依存 (crewai, boto3, trino,
      Bolt driver, kubernetes, FastAPI 等) を使い、solomon 本体だけ
      pip install -e . --no-deps する。イメージ構築は amp/Dockerfile.solomon-runtime
      と requirements-runtime.txt 参照。
    kernel: python3
    cpu: 2
    memory: 4

  # 2. React + Vite で solomon_ui をビルド → solomon/api/static/ に成果物を出す
  - type: run_session
    name: Build Solomon UI (React + Vite)
    script: amp/02_build_ui.py
    short_summary: nvm + npm ci/build で 3 ペイン UI をビルド
    long_summary: >-
      Workbench runtime に Node.js が無い場合はユーザー領域へ nvm + Node 20 を
      自動導入する。solomon_ui/ (React + TypeScript + Vite) を npm ci で依存固定し、
      本番ビルドを solomon/api/static/ に出す。FastAPI が SPA として / から配信する。
    kernel: python3
    cpu: 2
    memory: 4

  # 3. semantic/ (Ossie YAML) の Git 初期化。既存の repo に clone 済みなら no-op
  - type: run_session
    name: Prepare semantic (Ossie) Git repo
    script: amp/03_seed_semantic.py
    short_summary: semantic/ を Git 管理下に置き、Ossie 用ディレクトリを用意
    long_summary: >-
      semantic/{datasets,metrics,relationships,prompts,index} を作成し、
      Ossie Drafter が draft を PR ベースで積めるようにする。既に .git があれば
      スキップ。commit author は Workbench のユーザー ID を使う。
    kernel: python3
    cpu: 1
    memory: 2

  # 4. Agent Studio manifest の drift 検出 (CI ゲートを AMP 側でも走らせておく)
  - type: run_session
    name: Verify Agent Studio manifest is in sync
    script: amp/04_verify_manifest.py
    short_summary: python -m solomon.manifest --check で Python ⇄ YAML drift を検出
    long_summary: >-
      agent_studio_manifest/ 配下の YAML が solomon.tools / solomon.ingestion.crew の
      Python 定義と一致していることを確認する。ズレていたら AMP セットアップは
      失敗する (Model C ハイブリッドの契約)。
    kernel: python3
    cpu: 1
    memory: 2

  # 5. OpenSearch Launcher を Workbench Application として起動 (internal モード用)
  - type: start_application
    name: OpenSearch Launcher
    entity_label: opensearch-launcher
    subdomain: opensearch-launcher
    script: 1_start-opensearch/start_opensearch.py
    short_summary: Launch OpenSearch + Dashboards on Kubernetes for internal mode
    long_summary: >-
      OPENSEARCH_MODE=internal のとき Kubernetes 上で OpenSearch (k-NN 対応) と
      OpenSearch Dashboards を起動し、Launcher URL
      から /dashboards/ でプロキシ公開する。solomon-datasets インデックスも作成し、
      .solomon/opensearch_endpoints.json を Solomon と共有する。
      external モードでは supervisor は no-op (外部 OpenSearch を使用)。
    kernel: python3
    cpu: 2
    memory: 6

  # 6. Warehouse Launcher (Trino + DuckDB) — TRINO_MODE=internal
  - type: start_application
    name: Warehouse Launcher
    entity_label: warehouse-launcher
    subdomain: warehouse-launcher
    script: 1_start-warehouse/start_warehouse.py
    short_summary: Launch Trino with DuckDB catalog for internal Tables demo
    long_summary: >-
      TRINO_MODE=internal のとき Kubernetes 上で Trino coordinator と DuckDB
      ファイル (catalog iceberg) を 1 Pod で起動する。デモ schema demo に
      customers / orders を seed し、.solomon/trino_endpoints.json を Solomon と
      共有する。external モードでは supervisor は no-op (CDW Trino を使用)。
    kernel: python3
    cpu: 2
    memory: 4

  # 7. PuppyGraph Launcher — PUPPYGRAPH_MODE=internal
  - type: start_application
    name: PuppyGraph Launcher
    entity_label: puppygraph-launcher
    subdomain: puppygraph-launcher
    script: 1_start-puppygraph/start_puppygraph.py
    short_summary: Launch PuppyGraph on Kubernetes for internal Graph / openCypher
    long_summary: >-
      PUPPYGRAPH_MODE=internal のとき Kubernetes 上で PuppyGraph コンテナ
      (既定 puppygraph/puppygraph:1.15.0、PUPPYGRAPH_IMAGE で mirror 可) を起動し、
      .solomon/puppygraph_endpoints.json を Solomon と共有する。external モードでは
      supervisor は no-op (外部 Bolt を使用)。
    kernel: python3
    cpu: 2
    memory: 10

  # 8. Post-deploy env テンプレ (.solomon/deploy.env) — 既存ファイルは上書きしない
  - type: run_session
    name: Ensure deploy env file
    script: amp/06_ensure_deploy_env.py
    short_summary: Create .solomon/deploy.env from deploy/deploy.env.example if missing
    long_summary: >-
      AMP 再 Deploy 後も手入力を避けるため、永続ディレクトリ .solomon/deploy.env
      に post-deploy 設定を置く。初回のみ example をコピーし、以降はユーザー編集を保持。
      Application 起動時 (amp/05) にファイルが os.environ へマージされる。
    kernel: python3
    cpu: 1
    memory: 2

  # 9. Solomon API を Workbench Application として起動 (Knox パススルーで公開)
  - type: start_application
    name: Solomon
    entity_label: solomon-api
    subdomain: solomon
    static_subdomain: true
    script: amp/05_start_application.py
    short_summary: FastAPI + SPA を Workbench Application として起動
    long_summary: >-
      amp/05_start_application.py が CDSW_APP_PORT を待って uvicorn で FastAPI
      ``app`` を localhost bind する。/api/* と SPA (/) を配信。Knox JWT は
      X-Forwarded-User /
      Cookie から抽出し、Trino / CDV / IDBroker へパススルーする。LLM / Trino /
      Post-deploy env は .solomon/deploy.env を起動時に読み込む (Project Settings
      は任意上書き)。Deploy 手順は README「Deploy 後の設定」参照。
    kernel: python3
    cpu: 2
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION
