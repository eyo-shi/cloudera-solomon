      BuildDashboardResult に   fq_table_name / title / dashboard_id / dashboard_url /   dataset_id / dataset_reused / visual_ids
      / notes を詰める。同じダッシュボードを二重に作らないこと (このタスクは max_retries=0)。'
    expected_output: BuildDashboardResult の JSON。fq_table_name, title, dashboard_id, dashboard_url, dataset_id, dataset_reused,
      visual_ids, notes を含む。
    output_model: BuildDashboardResult
    inputs: []
    context:
    - table_inspection
    - viz_plan
    - cdv_startup
    max_retries: 0
    guardrail: null
