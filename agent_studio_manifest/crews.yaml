    context: []
    max_retries: 1
    guardrail: solomon.analytics.tasks.inspect_table_guardrail
  - name: viz_plan
    agent: viz_planner
    description: '前タスクの TableInspectionResult のカラム情報から、以下の手順でダッシュボード構成 (VizPlan) を作れ: (a) viz_heuristic に fq_table_name と
      columns   (name / trino_type / role / distinct_count / null_ratio) を渡し、  最大 6 個の Visual 候補を得る。(b) ossie_read で fq_name={fq_table_name}
      を読み、  存在すれば description / sample_queries を参照する。(c) 候補のうち意味の薄いもの (低カーディナリティ dim × 別 dim など)   を落として 3-5 個に絞り、各 Visual
      の name を日本語に整える   (例: ''revenue の推移'' → ''月次売上の推移'')。(d) title は ''このテーブルは何のダッシュボードか'' が伝わる短い日本語に。破壊系のカラム操作は絶対に含めず、SELECT
      / 集計に限定する。'
    expected_output: VizPlan の JSON。fq_table_name, title, visuals ([{name, viz_type, x, y, aggregation, group_by, description}])
      を含む。visuals は最低 1 個。
    output_model: VizPlan
