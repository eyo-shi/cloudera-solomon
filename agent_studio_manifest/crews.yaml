  process: sequential
  memory: false
  agents:
  - intent_classifier
  - dispatcher
  tasks:
  - name: intent_classification
    agent: intent_classifier
    description: '以下のユーザー発話を分類せよ。


      USER PROMPT:

      {prompt}


      SESSION_ID: {session_id}


      ENTITY_MEMORY (safe keys only):

      {entity_memory_hint}


      ## 接続済みソース (この環境で調べられるデータ)

      {source_catalog}


      ## 業務コンテキスト

      {domain_context}


      ## ルーティング例 (Ossie 例題)

      {routing_examples}


      判定基準:

      - 上記『接続済みソース』のテーブル・グラフ・文書を調べれば答えられる事実確認・調査・横断的な質問、およびそれらの事実を根拠にした報告書や文書のドラフト作成依頼は intent=''KNOWLEDGE_RAG''。

      - catalog.schema.table 形式でテーブルが明示され、かつ要約・傾向・サマリー系の依頼だけを intent=''ANALYZE_SUMMARY''。ダッシュボード・可視化・チャート作成の依頼で同様にテーブルが特定できる場合は
      intent=''ANALYZE_DASHBOARD''。

      - 代名詞 (『そのテーブル』等) と要約/ダッシュボード語があり、entity_memory_read で last_table が取れる場合のみ ANALYZE_*。テーブル指定のない『まとめて』『グラフで見せて』は、接続済みソースで調べる質問なら
      KNOWLEDGE_RAG を優先。


      手順:

      1) s3:// や取り込み・インジェスト依頼 → intent=''UNKNOWN'', needs_clarification=true（別プロジェクト案内）。

      2) 上記判定基準で KNOWLEDGE_RAG / ANALYZE_* / CHITCHAT を選ぶ。

      3) 挨拶・ヘルプ・雑談 → intent=''CHITCHAT''。

      4) 判別不能 → intent=''UNKNOWN'', needs_clarification=true。


      extracted_args に Knox JWT / STS / パスワード等の秘匿情報は絶対に含めない。confidence は 0.0-1.0 の float で自信度を入れる。'
    expected_output: IntentClassification の JSON。intent, confidence, extracted_args, needs_clarification, clarification_prompt,
      reasoning を含む。
    output_model: IntentClassification
    inputs:
    - prompt
    - session_id
    - entity_memory_hint
    - source_catalog
    - domain_context
    - routing_examples
    context: []
    max_retries: 1
    guardrail: null
  - name: dispatch_plan
    agent: dispatcher
    description: "前段の IntentClassification を、Python 側が実行できる DispatchPlan に変換せよ。\n\n変換ルール:\n  intent=ANALYZE_SUMMARY   -> child_crew='analytics_summary',\
      \ inputs={{fq_table_name, question}}, skip_child=false\n  intent=ANALYZE_DASHBOARD -> child_crew='analytics_dashboard',\
      \ inputs={{fq_table_name, question}}, skip_child=false\n  intent=KNOWLEDGE_RAG     -> child_crew='knowledge_rag', inputs={{question}},\
      \ skip_child=false\n  intent=CHITCHAT          -> child_crew='chitchat', skip_child=false, inputs={{prompt}}\n  intent=UNKNOWN\
      \ or needs_clarification=true -> child_crew='none', skip_child=true, response_markdown に clarification_prompt を書く\n\n\
      重要: kickoff Tool は使わない。DispatchPlan の JSON のみ返す。"
    expected_output: DispatchPlan の JSON。intent, child_crew, inputs, response_markdown, skip_child を含む。
    output_model: DispatchPlan
    inputs:
    - question
    - prompt
    context:
    - intent_classification
    max_retries: 1
    guardrail: null
- name: analytics_summary
  implemented: true
  process: sequential
  memory: false
  agents:
  - table_inspector
  - summary_writer
  tasks:
  - name: table_inspection
    agent: table_inspector
    description: '対象テーブル fq_table_name={fq_table_name} を調査せよ。以下の順で必ず実行する: (a) fq_table_name を catalog / schema / table にパースする
      (3 セグメント想定、''iceberg.demo.sales_2024'' → catalog=''iceberg'', schema=''demo'', table=''sales_2024'')。(b) trino_meta
      で columns と SHOW STATS を取る。  権限不足なら error_code=PERM_SELECT_DENIED、  テーブル未存在なら error_code=TRINO_TABLE_NOT_FOUND を返し、  それ以外のフィールドは空/None
      で構わない。(c) ossie_read で fq_name={fq_table_name} を読み、  存在すれば description / fields (dimension 付き列) / metrics / ai_context.examples
      を取り出す   (無くても error にせず、ossie_yaml_path=None で継続する)。(d) trino_query で ''SELECT * FROM {fq_table_name} LIMIT 20'' を実行し、  sample_rows
      に詰める。0 行でも error にはしない。(e) 各カラムの role は Ossie に一致名があればそれを、  無ければ trino_type から ''measure'' (数値系) / ''time'' (date/timestamp)
      /   ''dimension'' (それ以外) を選ぶ。'
    expected_output: TableInspectionResult の JSON。fq_table_name, catalog, schema, table, exists, has_select_priv, error_code,
      message, columns (name/trino_type/nullable/null_ratio/distinct_count/low_value/high_value/role), row_count_estimate,
      ossie_yaml_path, ossie_description, ossie_dimension_fields, ossie_metrics, sample_rows を含む。
    output_model: TableInspectionResult
    inputs:
    - fq_table_name
    context: []
    max_retries: 1
    guardrail: solomon.analytics.tasks.inspect_table_guardrail
  - name: summary
    agent: summary_writer
    description: '前タスクの TableInspectionResult を踏まえ、日本語 Markdown で テーブル内容を 5-15 行程度に要約せよ。含めるべき観点 (それぞれ 1-3 行):   1. 全体像 (行数目安・カラム数・主な
      dimension と measure)。     row_count_estimate が None のときは「統計未収集」と明示。  2. 分布 (distinct_count が小さい dimension は代表値を列挙、     数値カラムは
      low_value / high_value を提示)。  3. データ品質 (null_ratio が 0.2 以上のカラムは列挙、     sample_rows が空なら「サンプル取得 0 行」と警告)。  4. Ossie
      に description があればそれを冒頭に置き、     無ければ「セマンティックレイヤ未整備」と 1 行で触れる。  5. 個人情報が疑われるカラム名 (email/phone/address/name 等) は      具体値を書かず
      warnings に回す。最後に sample_queries として ''question (日本語) と sql (Trino SELECT)'' の組を 2-3 件提案。SQL は fq_table_name={fq_table_name}
      を使い、破壊系 (INSERT/UPDATE/DELETE/CREATE/DROP) は絶対に含めない。'
    expected_output: SummaryReport の JSON。fq_table_name, summary_markdown, observations (category/headline/detail), warnings,
      sample_queries ([{question, sql}]) を含む。
    output_model: SummaryReport
    inputs:
    - fq_table_name
    context:
    - table_inspection
    max_retries: 1
    guardrail: null
